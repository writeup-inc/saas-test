<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>徳尾先生アバター マイページ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
</head><body>
<style>
/* Layout: 上に案の切替、その下に「会員画面／アバター相談画面」のタブ付きモック。会員画面は左メニュー＋本文、アバター画面は先生の映像＋会話。狭い画面では縦一列 */
:root{
  color-scheme:light;
  --ivory:#FBF8EE; --ivory-green:#E4EDCF; --leaf:#4E7330; --leaf-light:#7FA35A;
  --blue:#0E7FAA; --blue-bright:#1593C2; --lagoon:#7FD0DF; --lagoon-soft:#E3F4F7; --hibiscus:#EE7A62; --hibiscus-soft:#FCE7E1;
  --ink:#24434C; --ink-soft:#557079; --line:#D9DFC6;
  --shell:#F1F2EC; --white:#FFFFFF; --gray:#F5F6F4; --gray-line:#E3E6E1; --text-std:#2A3238; --muted-std:#66707A;
  --f-kyo:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--shell);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.shellhead{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--ink-soft)}
.shellhead h1{font-family:var(--f-kyo);font-weight:600;font-size:clamp(24px,3.6vw,32px);margin:0;line-height:1.35}
.shellhead p{margin:0;color:var(--ink-soft);max-width:70ch;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;align-self:flex-start}
.seg button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink-soft);padding:8px 18px;border-radius:999px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}

/* ===== 共通のモック枠 ===== */
.mock{border:1px solid var(--frame-line);border-radius:var(--r-frame);overflow:hidden;background:var(--bg);color:var(--fg)}
.tabs{display:flex;background:var(--tab-bg);border-bottom:1px solid var(--frame-line);overflow-x:auto}
.tabs button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--muted);padding:14px 22px;cursor:pointer;white-space:nowrap;border-right:1px solid var(--frame-line);min-height:48px}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}

/* A：スタンダード */
.mock.va{--bg:var(--white);--fg:var(--text-std);--muted:var(--muted-std);--frame-line:var(--gray-line);--tab-bg:var(--gray);--accent:var(--blue);--accent-soft:#E7F2F7;--panel:var(--white);--panel-line:var(--gray-line);--soft:var(--gray);--r-frame:8px;--r:8px;--disp:var(--f-body)}
/* B：世界観（明るい南の海・アイボリー・教科書体） */
.mock.vb{--bg:var(--ivory);--fg:var(--ink);--muted:var(--ink-soft);--frame-line:var(--line);--tab-bg:var(--ivory-green);--accent:var(--blue);--accent-soft:var(--lagoon-soft);--panel:var(--white);--panel-line:var(--line);--soft:var(--ivory-green);--r-frame:20px;--r:16px;--disp:var(--f-kyo)}

.member{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:600px}
.side{border-right:1px solid var(--frame-line);padding:20px 0;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.side button{font:inherit;font-size:15px;text-align:left;border:0;background:transparent;color:var(--fg);padding:12px 22px;cursor:pointer;min-height:48px;border-left:3px solid transparent}
.side button[aria-current="page"]{background:var(--soft);border-left-color:var(--accent);font-weight:700}
.vb .side{background:var(--ivory)}
.vb .side button{font-family:var(--f-kyo);font-size:16px;border-left:0;border-radius:999px;margin:0 12px;padding:10px 16px}
.vb .side button[aria-current="page"]{background:var(--ivory-green);color:var(--leaf)}
.vb ruby rt{font-family:var(--f-body);font-size:.5em;color:var(--ink-soft);letter-spacing:.04em}
.main{padding:24px clamp(16px,3vw,36px) 36px;display:flex;flex-direction:column;gap:18px;min-width:0}
@container mock (max-width:760px){
  .member{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--frame-line);padding:8px}
  .side button{flex:0 0 auto;border-left:0;padding:8px 14px}
  .side button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .vb .side button{margin:0}
}
.h{font-family:var(--disp);font-weight:600;font-size:22px;margin:0;line-height:1.5}
.sub{margin:0;color:var(--muted);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vb .panel{border-width:1.5px}
.panel h3{font-family:var(--disp);font-weight:600;font-size:17px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.k{font-size:12px;color:var(--muted)}
.v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--disp)}
.btn{font:inherit;font-size:15px;font-weight:700;border-radius:var(--r);padding:10px 18px;min-height:46px;cursor:pointer;border:1px solid var(--fg);background:var(--panel);color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--white);border-color:var(--accent)}
.btn.sm{font-size:14px;min-height:40px;padding:8px 14px}
.vb .btn{border-radius:999px;border-color:var(--panel-line);border-width:1.5px}
.vb .btn.pri{border-color:var(--accent)}
.vb .btn.warm{background:var(--hibiscus);border-color:var(--hibiscus);color:#3B1A12}
.link{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px}
.pill.ok{color:var(--leaf);background:var(--ivory-green)}
.pill.warn{color:#8A3A25;background:var(--hibiscus-soft)}
.pill.tag{color:var(--blue);background:var(--accent-soft)}
.sample{font-size:11px;color:var(--muted);border:1px dashed var(--panel-line);border-radius:4px;padding:0 6px;align-self:flex-start}
ul.dots{margin:0;padding-left:1.2em}
.note{font-size:13px;color:var(--muted);margin:0}
.flash{font-size:14px;color:var(--leaf);background:var(--ivory-green);border-radius:var(--r);padding:8px 12px;margin:0}

/* B の帯（海と太陽） */
.wave{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,var(--blue-bright) 0%,#3AB0D3 55%,var(--lagoon) 100%);color:var(--white);padding:22px 22px 48px}
.wave b{font-family:var(--f-kyo);font-weight:600;font-size:22px;display:block;line-height:1.5;text-shadow:0 1px 2px rgba(10,60,80,.35)}
.wave span{font-size:14px;text-shadow:0 1px 2px rgba(10,60,80,.35)}
.wave .sun{position:absolute;right:24px;top:10px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#FFF6D8 0%,rgba(255,246,216,.35) 55%,rgba(255,246,216,0) 72%)}
.wave svg{position:absolute;left:0;bottom:-1px;width:100%;height:40px}

/* ホームの入口 */
.entry{display:flex;flex-direction:column;gap:12px}
.entry .row .btn{flex:1 1 180px;min-height:56px;font-size:16px}

/* 履歴 */
.hist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
@container mock (max-width:980px){.hist{grid-template-columns:minmax(0,1fr)}}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hitem{font:inherit;text-align:left;width:100%;background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);padding:12px 14px;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;gap:4px}
.hitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hitem .t{font-weight:700;font-family:var(--disp)}
.hitem .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.habitline{border-left:3px solid var(--leaf-light);padding-left:10px;margin:0}
.reply{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:14px}
.vb .reply{font-family:var(--f-kyo)}

/* フォーム */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select,textarea,input[type=text]{font:inherit;font-size:15px;color:var(--fg);background:var(--white);border:1px solid var(--panel-line);border-radius:var(--r);padding:10px 12px;width:100%}
.vb select,.vb textarea,.vb input[type=text]{border-width:1.5px;border-radius:12px}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;border:1px solid var(--panel-line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:38px}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--blue)}

/* 文庫 */
.progress{height:10px;background:var(--accent-soft);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf-light)}
.book{width:116px;height:156px;border-radius:4px 12px 12px 4px;background:linear-gradient(90deg,var(--blue-bright) 0 10px,var(--ivory-green) 10px);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:12px 12px 12px 22px;font-family:var(--f-kyo);font-size:13px;text-align:center;flex:0 0 auto;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--panel-line);vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.voice{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--panel-line);padding-bottom:12px}
.voice:last-child{border-bottom:0;padding-bottom:0}
.voice p{margin:0}
.vb .voice p{font-family:var(--f-kyo);font-size:17px}

/* ===== アバター相談画面 ===== */
.avatar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:640px}
@container mock (max-width:900px){.avatar{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 20px;text-align:center;overflow:hidden;border-right:1px solid var(--frame-line);min-height:360px}
.va .stage{background:var(--gray)}
.vb .stage{background:linear-gradient(180deg,#9FDCEB 0%,#D6F0F5 45%,var(--ivory) 100%)}
.vb .stage .sun{position:absolute;right:12%;top:8%;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#FFF6D8 0%,rgba(255,246,216,.4) 55%,rgba(255,246,216,0) 72%)}
.vb .stage svg.sea{position:absolute;left:0;bottom:0;width:100%;height:120px}
.face{position:relative;z-index:1;width:200px;height:200px;border-radius:50%;background:var(--white);border:1px solid var(--frame-line);display:grid;place-items:center;overflow:hidden}
.vb .face{border:6px solid var(--white);box-shadow:0 10px 30px rgba(21,147,194,.25)}
.face svg{width:70%;height:70%}
.speaking{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--white);border-radius:999px;padding:4px 12px;border:1px solid var(--frame-line)}
.speaking i{width:8px;height:8px;border-radius:50%;background:var(--leaf-light)}
.stage .cap{position:relative;z-index:1;font-size:13px;color:var(--muted);margin:0}
.stage .name{position:relative;z-index:1;font-family:var(--disp);font-size:18px;font-weight:600}
.talk{display:flex;flex-direction:column;min-width:0}
.steps{display:flex;gap:4px;padding:12px 16px;border-bottom:1px solid var(--frame-line);overflow-x:auto}
.steps button{font:inherit;font-size:13px;border:1px solid var(--panel-line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;min-height:36px;display:inline-flex;gap:6px;align-items:center}
.steps button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--white);font-weight:700}
.steps .fee{font-size:11px;border-radius:999px;padding:0 6px;background:var(--ivory-green);color:var(--leaf)}
.steps .fee.paid{background:var(--hibiscus-soft);color:#8A3A25}
.steps button[aria-pressed="true"] .fee{background:rgba(255,255,255,.9)}
.log{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:520px}
.banner{font-size:13px;background:var(--accent-soft);color:var(--fg);border-radius:var(--r);padding:8px 12px}
.msg{max-width:86%;padding:10px 14px;border-radius:var(--r);font-size:15px;line-height:1.7}
.msg.t{align-self:flex-start;background:var(--panel);border:1px solid var(--panel-line)}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--white)}
.vb .msg.t{font-family:var(--f-kyo);font-size:16px;border-radius:4px 18px 18px 18px}
.vb .msg.u{border-radius:18px 4px 18px 18px}
.msg .via{display:block;font-size:11px;opacity:.85;margin-bottom:2px}
.gate{border:2px solid var(--hibiscus);background:var(--hibiscus-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.gate b{font-family:var(--disp);font-size:17px}
.inputbar{border-top:1px solid var(--frame-line);padding:12px 16px;display:flex;gap:8px;align-items:center}
.mic{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--white);display:grid;place-items:center;cursor:pointer}
.vb .mic{background:var(--hibiscus);color:#3B1A12}
.mic svg{width:24px;height:24px}
.inputbar input{flex:1;min-width:0}
.endrow{padding:0 16px 14px;display:flex;justify-content:flex-end}
.summary{display:flex;flex-direction:column;gap:12px}
footer{font-size:12px;color:var(--ink-soft)}

/* ===== B：世界地図の会員画面 ===== */
.world{display:flex;flex-direction:column;gap:0}
.worldhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1.5px solid var(--line);background:var(--ivory)}
.worldhead b{font-family:var(--f-kyo);font-weight:600;font-size:20px}
.worldhead .note{font-size:13px}
.mapscroll{overflow-x:auto;background:#8FD6E6}
.map{position:relative;min-width:760px;aspect-ratio:1000/560;background:radial-gradient(ellipse at 58% 58%,#BDEAF2 0%,#7FD0DF 45%,#3AB0D3 100%)}
.map svg.base{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);font:inherit;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;color:var(--ink)}
.pin .ic{width:52px;height:52px;border-radius:50%;background:var(--ivory);border:3px solid var(--white);box-shadow:0 6px 16px rgba(14,90,120,.3);display:grid;place-items:center;color:var(--blue);position:relative;transition:transform .2s}
.pin .ic svg{width:26px;height:26px}
.pin:hover .ic,.pin:focus-visible .ic{transform:scale(1.1)}
.pin .lb{background:var(--white);border-radius:999px;padding:3px 12px;font-family:var(--f-kyo);font-weight:600;font-size:14px;line-height:1.4;box-shadow:0 2px 8px rgba(14,90,120,.2);white-space:nowrap;text-align:center}
.pin .lb small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--ink-soft)}
.pin .badge{position:absolute;top:-4px;right:-6px;min-width:22px;height:22px;border-radius:999px;background:var(--hibiscus);color:#3B1A12;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid var(--white)}
.center{position:absolute;left:58%;top:59%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.center .halo{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,216,.95) 0%,rgba(255,246,216,.5) 50%,rgba(255,246,216,0) 72%);position:absolute;top:-24px;left:50%;transform:translateX(-50%);pointer-events:none}
.center .tface{position:relative;font:inherit;width:104px;height:104px;border-radius:50%;background:var(--white);border:5px solid var(--white);box-shadow:0 0 0 4px rgba(255,246,216,.9),0 10px 28px rgba(14,90,120,.35);cursor:pointer;padding:0;overflow:hidden;display:grid;place-items:center}
.center .tface svg{width:78%;height:78%}
.center .tname{position:relative;font-family:var(--f-kyo);font-weight:600;font-size:16px;background:var(--white);border-radius:999px;padding:2px 14px;box-shadow:0 2px 8px rgba(14,90,120,.2)}
.center .acts{position:relative;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.center .acts button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;border:2px solid var(--white);background:var(--blue);color:var(--white);box-shadow:0 4px 12px rgba(14,90,120,.3)}
.center .acts button.sec{background:var(--ivory);color:var(--ink)}
.today{position:absolute;left:2%;bottom:5%;background:rgba(251,248,238,.95);border-radius:16px;padding:10px 14px;max-width:250px;box-shadow:0 4px 14px rgba(14,90,120,.2);font-size:13px;line-height:1.6}
.today b{font-family:var(--f-kyo);font-size:15px;display:block}
.compass{position:absolute;right:2.5%;bottom:5%;width:74px;height:74px;opacity:.9}
.toc{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;background:var(--ivory);border-top:1.5px solid var(--line)}
.toc span{font-size:12px;color:var(--ink-soft);width:100%}
.toc button{font:inherit;font-family:var(--f-kyo);font-size:14px;border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:38px;color:var(--ink)}
.placebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 18px;background:linear-gradient(90deg,var(--blue-bright),#3AB0D3 60%,var(--lagoon));color:var(--white)}
.placebar button{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--white);background:rgba(255,255,255,.15);color:var(--white);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px}
.placebar b{font-family:var(--f-kyo);font-weight:600;font-size:18px;text-shadow:0 1px 2px rgba(10,60,80,.35)}
.placebar span{font-size:13px;text-shadow:0 1px 2px rgba(10,60,80,.35)}

.pin.home .ic{width:68px;height:68px;background:var(--white);color:var(--hibiscus);border-width:4px;box-shadow:0 0 0 6px rgba(238,122,98,.25),0 8px 20px rgba(14,90,120,.35)}
.pin.home .ic svg{width:32px;height:32px}
.pin.home .lb{font-size:16px}
.pin .lb em{display:block;font-style:normal;font-family:var(--f-body);font-size:10px;font-weight:700;color:#8A3A25;letter-spacing:.08em}
.tcomment{position:absolute;right:2%;top:4%;width:34%;max-width:340px;display:flex;gap:10px;align-items:flex-start}
.tc-face{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--white);border:4px solid var(--white);box-shadow:0 0 0 3px rgba(255,246,216,.9),0 6px 16px rgba(14,90,120,.3);display:grid;place-items:center;overflow:hidden}
.tc-face svg{width:80%;height:80%}
.tc-bubble{position:relative;background:rgba(251,248,238,.97);border-radius:4px 18px 18px 18px;padding:10px 14px 12px;box-shadow:0 6px 18px rgba(14,90,120,.25);display:flex;flex-direction:column;gap:6px;min-width:0}
.tc-who{font-size:12px;color:var(--ink-soft)}
.tc-bubble p{margin:0;font-family:var(--f-kyo);font-size:14px;line-height:1.65}

.map{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M15 3 L15 20 L5 20 Z' fill='%23FBF8EE' stroke='%2324434C' stroke-width='1.6' stroke-linejoin='round'/><path d='M17 6 L17 20 L26 20 Z' fill='%23EE7A62' stroke='%2324434C' stroke-width='1.6' stroke-linejoin='round'/><path d='M2 22 H30 L25.5 29 H6.5 Z' fill='%230E7FAA' stroke='%2324434C' stroke-width='1.6' stroke-linejoin='round'/></svg>") 16 24,crosshair}
.map .pin,.map .pin *{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M15 3 L15 20 L5 20 Z' fill='%23FBF8EE' stroke='%2324434C' stroke-width='1.6' stroke-linejoin='round'/><path d='M17 6 L17 20 L26 20 Z' fill='%23EE7A62' stroke='%2324434C' stroke-width='1.6' stroke-linejoin='round'/><path d='M2 22 H30 L25.5 29 H6.5 Z' fill='%230E7FAA' stroke='%2324434C' stroke-width='1.6' stroke-linejoin='round'/></svg>") 16 24,pointer}
.pin{--h:26px;transform:translate(-50%,calc(-1 * var(--h)));padding:4px}
.pin .ic{width:44px;height:44px;border-width:3px}
.pin .ic svg{width:22px;height:22px}

.pin.side-r .lb{text-align:left}
.pin.side-l{flex-direction:row-reverse;gap:6px;transform:translate(calc(-100% + var(--h)),-50%)}
.pin.side-t{flex-direction:column-reverse;transform:translate(-50%,calc(-100% + var(--h)))}
.pin.home{--h:34px}
.pin.home .ic{width:60px;height:60px}
.pin.home .ic svg{width:28px;height:28px}
.pin.home .lb{font-size:15px}
.pin .badge{min-width:20px;height:20px;font-size:11px}
.tcomment{width:30%;max-width:300px;right:1.5%;top:3%}
.tc-face{width:52px;height:52px;border-width:3px}
.tc-bubble{padding:8px 12px 10px;gap:5px}
.tc-bubble p{font-size:13px;line-height:1.6}
.tc-acts button{font-size:11.5px;min-height:30px;padding:3px 10px}
.compass{width:60px;height:60px;right:2%;bottom:4%}
.map{min-width:820px}

/* 調整2：項目を少し大きく、ホバーで国のアイコンに変わる、豆知識の吹き出し */
.pin{--h:30px}

.tip{position:absolute;z-index:5;width:250px;transform:translate(14px,14px);background:var(--white);border-radius:4px 16px 16px 16px;padding:10px 14px;box-shadow:0 8px 22px rgba(14,90,120,.3);font-family:var(--f-kyo);font-size:13.5px;line-height:1.65;color:var(--ink);pointer-events:none}

@keyframes pop{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}

/* 調整3：先生の一言をコンパクトに */
.tcomment{width:auto;max-width:280px;right:1.5%;top:3%;gap:8px;align-items:flex-start}

/* 調整4：先生の部屋・イルカ */
.photo{aspect-ratio:4/3;border-radius:12px;background:linear-gradient(160deg,var(--lagoon-soft),var(--ivory-green));border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-soft)}

.dolphin{position:absolute;left:66%;top:82.8%;width:62px;height:31px;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;z-index:3;animation:swim 18s linear forwards}
.dolphin .dbody{position:absolute;inset:0;transform-origin:50% 60%;animation:hop 2.6s ease-in-out infinite}
.dolphin .dbody svg{width:100%;height:100%;overflow:visible}
.dolphin .fish{position:absolute;left:62%;top:-58px;width:16px;height:10px;opacity:0}
.dolphin .fish svg{width:100%;height:100%}
.dolphin .splash{position:absolute;left:50%;bottom:-6px;width:44px;height:8px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(255,255,255,.95);opacity:0;animation:ripple 2.6s ease-out infinite}
.dolphin .fish.drop{animation:fall .6s ease-in forwards}
.dolphin.fed .dbody{animation:bigjump 1.7s ease-in-out .45s 1,hop 2.6s ease-in-out 2.15s infinite}
@keyframes swim{0%{left:66%;top:82.8%;opacity:0}5%{opacity:1}95%{opacity:1}100%{left:84%;top:77.4%;opacity:0}}
@keyframes hop{0%{transform:translateY(12px) rotate(-12deg);opacity:0}10%{opacity:1}32%{transform:translateY(-14px) rotate(-30deg)}50%{transform:translateY(-22px) rotate(0deg)}68%{transform:translateY(-10px) rotate(30deg)}84%{transform:translateY(10px) rotate(40deg);opacity:1}100%{transform:translateY(14px) rotate(42deg);opacity:0}}
@keyframes bigjump{0%{transform:translateY(12px) rotate(-12deg)}35%{transform:translateY(-44px) rotate(-35deg)}55%{transform:translateY(-54px) rotate(-180deg)}75%{transform:translateY(-30px) rotate(-340deg)}100%{transform:translateY(12px) rotate(-320deg);opacity:0}}
@keyframes ripple{0%{opacity:.85;transform:translateX(-50%) scale(.3)}14%{opacity:0;transform:translateX(-50%) scale(1.3)}82%{opacity:0;transform:translateX(-50%) scale(.3)}88%{opacity:.85;transform:translateX(-50%) scale(.5)}100%{opacity:0;transform:translateX(-50%) scale(1.5)}}
@keyframes fall{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(54px)}}
.dolphin:focus-visible{outline:3px solid var(--white);border-radius:12px}

.hrow{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);overflow:hidden}
.hrow.open{border-color:var(--accent)}
.hhead{font:inherit;width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left;background:transparent;border:0;padding:12px 16px;cursor:pointer;color:var(--fg);min-height:52px}
.hhead .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hhead .t{font-weight:700;font-family:var(--f-kyo);flex:1 1 160px}
.hhead .chev{font-size:18px;color:var(--accent);width:20px;text-align:center}
.hbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--panel-line);padding-top:12px}
.quiet{display:inline-flex;gap:12px;margin-left:auto}
.quiet .link{font-size:12px;color:var(--muted)}
.reply.withface{display:flex;gap:10px;align-items:flex-start}
.rf{flex:0 0 auto;width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid var(--white);box-shadow:0 1px 4px rgba(14,90,120,.25)}
.rf img{width:100%;height:100%;object-fit:cover;display:block}
.quietpanel{background:var(--soft,#F6F8F2)}
.quietpanel details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.book2{flex:0 0 auto;width:132px;height:180px;border-radius:4px 14px 14px 4px;background:linear-gradient(90deg,#0E7FAA 0 12px,#FBF8EE 12px);border:1px solid var(--line);box-shadow:6px 8px 0 rgba(36,67,76,.08);display:flex;flex-direction:column;justify-content:space-between;padding:18px 12px 12px 24px}
.book2 .bt{font-family:var(--f-kyo);font-weight:600;font-size:16px;line-height:1.5;color:var(--ink)}
.book2 .bn{font-size:12px;color:var(--ink-soft)}
.host{flex-direction:row;flex-wrap:wrap;align-items:center;gap:20px}
.hphoto{flex:0 0 auto;width:150px;height:170px;border-radius:16px;overflow:hidden;border:4px solid var(--white);box-shadow:0 6px 18px rgba(14,90,120,.2)}
.hphoto img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;max-width:none}
.hinfo{flex:1 1 240px;display:flex;flex-direction:column;gap:4px;min-width:0}
.hinfo h3{margin:0}
.evlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.evlist li{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--panel-line)}
.evlist li:last-child{border-bottom:0}
.evd{font-size:13px;font-weight:700;color:var(--accent);min-width:120px;font-variant-numeric:tabular-nums}
.evt{flex:1 1 200px;display:flex;flex-direction:column;min-width:0}
.evt b{font-family:var(--f-kyo)}
@container mock (max-width:720px){.atop{justify-content:space-between}.quiet{margin-left:0}.hphoto{width:110px;height:126px}}

/* 先生に相談：先生の顔を大きく、まわりに選択肢 */
.stagehome{background:radial-gradient(ellipse at 50% 42%,#FFF8DE 0%,rgba(255,248,222,0) 46%),linear-gradient(180deg,var(--lagoon-soft),var(--white));padding:26px 20px 14px}
.ring{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px}
.opts{display:flex;flex-direction:column;gap:12px}
.opts.l{align-items:flex-end}.opts.r{align-items:flex-start}
.opt{word-break:keep-all;overflow-wrap:anywhere;font:inherit;font-family:var(--f-kyo);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;background:var(--white);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px;min-height:46px;cursor:pointer;box-shadow:0 3px 10px rgba(14,90,120,.1);max-width:100%;text-align:left}
.opt .mi{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lagoon-soft);color:var(--blue)}
.opt .mi svg{width:18px;height:18px}
.opt:hover{border-color:var(--blue);background:var(--lagoon-soft)}
.opt.warmish .mi{background:var(--hibiscus-soft);color:#B4502F}
.opt.warmish:hover{border-color:var(--hibiscus);background:var(--hibiscus-soft)}
.opts.l .opt:nth-child(2),.opts.r .opt:nth-child(2){margin-inline:24px}
.tcenter{display:flex;flex-direction:column;align-items:center;gap:12px}
.bigface{width:210px;height:210px;border-radius:50%;overflow:hidden;border:6px solid var(--white);box-shadow:0 0 0 10px rgba(255,246,216,.85),0 14px 34px rgba(14,90,120,.22)}
.bigface img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.tbub{position:relative;background:var(--white);border-radius:16px;padding:8px 16px;text-align:center;box-shadow:0 3px 10px rgba(14,90,120,.1)}
.tbub::before{content:"";position:absolute;left:50%;top:-7px;width:14px;height:14px;background:var(--white);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tbub p{margin:0;font-family:var(--f-kyo);font-size:15.5px;line-height:1.6;position:relative}
.tbub .k{position:relative}
@container mock (max-width:820px){
  .ring{grid-template-columns:minmax(0,1fr);gap:14px}
  .tcenter{order:-1}
  .bigface{width:160px;height:160px;box-shadow:0 0 0 8px rgba(255,246,216,.85),0 10px 26px rgba(14,90,120,.2)}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .opts.l,.opts.r{align-items:stretch}
  .opts.l .opt:nth-child(2),.opts.r .opt:nth-child(2){margin-inline:0}
  .opt{font-size:13px;padding:5px 10px 5px 5px;min-height:44px;border-radius:14px}
  .opt .mi{width:30px;height:30px}
  .stagehome{padding:18px 12px 10px}
  .tbub p{font-size:14px}
}

.cards.trips{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@container mock (max-width:760px){.cards.trips{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 左下：文字の大きさ＋アカウント */
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:16px 12px 4px;border-top:1px solid var(--frame-line)}
.sidefoot .fs{align-self:flex-start}
.side .acct{display:flex;align-items:center;gap:10px;font-size:15px}
.side .acct svg{width:20px;height:20px;flex:0 0 auto;color:var(--muted)}
.vb .side .acct{margin:0}
.side .fs button,.vb .side .fs button{min-height:34px;min-width:36px;padding:0;border-radius:999px;margin:0;font-family:var(--f-body)}
.side .fs button[aria-pressed="true"]{background:var(--accent);color:var(--white)}
.cards.mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cards.mini .panel{padding:10px 12px;gap:4px}
.cards.mini .v{font-size:18px}
.cards.mini b{font-size:13.5px;line-height:1.45;font-family:var(--f-kyo)}
.cards.mini .k{font-size:11.5px}
.cards.mini .note,.cards.mini .link{font-size:11.5px}
@container mock (max-width:900px){.cards.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
.side .fs button,.vb .side .fs button{width:38px;height:34px;display:grid;place-items:center;border:0;text-align:center}
@container mock (max-width:760px){
  .member .side{flex-wrap:wrap;overflow:visible}
  .sidefoot{flex:1 0 100%;margin-top:4px;flex-direction:row;align-items:center;justify-content:space-between;border-top:1px solid var(--frame-line);padding:6px 2px 0;gap:8px}
  .side .acct{padding:6px 10px;font-size:13px}
}

/* 先生に相談：先生のまわりに選択肢がふわふわ浮かぶ */
.floatstage{position:relative;height:440px;padding:0;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#FFF8DE 0%,rgba(255,248,222,0) 40%),linear-gradient(180deg,#BFE6EF 0%,#E6F4F4 60%,var(--white) 100%)}
.frays{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.frays line{stroke:#FFFFFF;stroke-width:2;stroke-dasharray:3 7;vector-effect:non-scaling-stroke;opacity:.95}
.frays.sp{display:none}
.fcenter{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:1}
.floatstage .bigface{width:190px;height:190px;box-shadow:0 0 0 12px rgba(255,246,216,.85),0 0 60px rgba(255,214,120,.65),0 14px 34px rgba(14,90,120,.2)}
.fbub{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;font:inherit;font-family:var(--f-kyo);font-weight:700;font-size:14px;line-height:1.35;white-space:nowrap;background:var(--white);color:var(--ink);border:2px solid var(--white);border-radius:999px;padding:7px 16px;min-height:44px;cursor:pointer;box-shadow:0 6px 16px rgba(14,90,120,.16);display:flex;flex-direction:column;align-items:center;animation:fbfloat 4.2s ease-in-out infinite alternate}
.fbub .fk{font-size:10px;letter-spacing:.08em;color:var(--blue)}
.fbub.learn{background:#F4F8E8}.fbub.learn .fk{color:var(--leaf)}
.fbub.happy{background:#FFF1EC}.fbub.happy .fk{color:#8A3A25}
.fbub.cont{background:var(--hibiscus);color:#3B1A12;border-color:#FFFFFF;box-shadow:0 8px 20px rgba(238,122,98,.38)}
.fbub.cont .fk{color:#5A2416}
.fbub:hover{box-shadow:0 10px 22px rgba(14,90,120,.26);border-color:var(--blue)}
.fbub.cont:hover{border-color:#FFFFFF;filter:brightness(1.04)}
@keyframes fbfloat{from{margin-top:-5px}to{margin-top:5px}}
@media (prefers-reduced-motion:reduce){.fbub{animation:none}}
@container mock (max-width:820px){
  .floatstage{height:600px}
  .frays.pc{display:none}.frays.sp{display:block}
  .fcenter{top:27%;gap:10px}
  .floatstage .tbub{white-space:nowrap;padding:6px 14px}
  .floatstage .tbub p{font-size:13px}
  .floatstage .bigface{width:140px;height:140px;box-shadow:0 0 0 8px rgba(255,246,216,.85),0 0 40px rgba(255,214,120,.6),0 10px 26px rgba(14,90,120,.2)}
  .fbub{left:var(--sx);top:var(--sy);font-size:12.5px;padding:6px 12px;white-space:normal;word-break:keep-all;width:44%;text-align:center}
  .floatstage .tbub p{font-size:13.5px}
}

/* 選択肢＋「先生と話す」 */
.fbub.hello{background:#FFFBEA}.fbub.hello .fk{color:#9A6A12}
.floatstage{height:500px}
.fcenter{top:42%}
.fbub{width:max-content}
.fbub.world{background:#FFF7E6}.fbub.world .fk{color:#9A6A12}
.freego{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;font:inherit;font-family:var(--f-kyo);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:var(--white);border:2px solid var(--white);border-radius:999px;padding:8px 22px;min-height:48px;cursor:pointer;box-shadow:0 8px 20px rgba(14,127,170,.3);white-space:nowrap}
.freego svg{width:20px;height:20px}
.freego:hover{filter:brightness(1.06)}
@container mock (max-width:820px){
  .floatstage{height:720px}
  .fbub{width:44%}
  .fcenter{top:20%}
  .freego{bottom:14px;font-size:14px;padding:8px 18px}
}

/* B：4つの場所＋右上に文字の大きさ・アカウント */
.worldhead{flex-wrap:wrap}
.wh-l{display:flex;flex-direction:column;gap:0;min-width:0}
.headtools{display:flex;align-items:center;gap:8px;margin-left:auto}
.headtools .fs button{width:36px;height:32px;display:grid;place-items:center;padding:0;min-height:0}
.acct2{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--white);color:var(--ink);border-radius:999px;padding:5px 12px 5px 9px;min-height:38px;cursor:pointer}
.acct2 svg{width:18px;height:18px}
.acct2[aria-current="page"]{border-color:var(--blue);color:var(--blue)}
.placebar .headtools .fs{background:rgba(255,255,255,.92)}
.placebar .acct2{border-color:#FFFFFF}
.tc-face.photo-on{padding:0}
.tc-face.photo-on img{width:100%;height:100%;object-fit:cover;display:block}
.fs-s .zoomwrap{zoom:.92}.fs-l .zoomwrap{zoom:1.2}
@container mock (max-width:760px){
  .headtools{margin-left:0;width:100%;justify-content:space-between}
  .headtools .fs>span{display:none}
  .worldhead .headtools{order:2}
}
/* 地図のおまけ */
.honu{position:absolute;transform:translate(-50%,-50%);width:58px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;z-index:2;animation:honu 6s ease-in-out infinite}
.honu svg{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(14,90,120,.3));transition:transform .3s}
.honu:hover svg,.honu:focus-visible svg{transform:scale(1.12)}
@keyframes honu{0%{margin-left:-14px;rotate:-6deg}50%{margin-left:14px;rotate:6deg}100%{margin-left:-14px;rotate:-6deg}}
.uluru{position:absolute;transform:translate(-50%,-50%);width:70px;height:70px;border:0;background:transparent;padding:0;cursor:pointer;z-index:2;display:grid;place-items:center}
.uluru .sq{position:absolute;inset:6px;border:2px dashed rgba(217,98,62,.85);border-radius:6px;animation:sqspin 14s linear infinite}
.uluru .sq.s2{inset:14px;border:2px solid rgba(255,255,255,.95);border-radius:4px;animation-duration:9s;animation-direction:reverse}
.uluru .ur{position:relative;width:38px;height:38px;border-radius:8px;background:#FBF0D9;display:grid;place-items:center;box-shadow:0 4px 12px rgba(138,58,37,.3);transition:transform .5s}
.uluru .ur svg{width:30px;height:30px;transition:transform .5s}
.uluru .ul{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-4px;background:var(--white);border-radius:999px;padding:1px 10px;font-family:var(--f-kyo);font-weight:700;font-size:12px;color:#8A3A25;white-space:nowrap;box-shadow:0 2px 8px rgba(14,90,120,.2)}
.uluru:hover .ur,.uluru.on .ur{transform:scale(1.08)}
@keyframes sqspin{to{transform:rotate(360deg)}}
.gpop{position:absolute;z-index:6;transform:translate(-50%,0);width:240px;background:var(--white);border-radius:16px;padding:10px 14px;box-shadow:0 8px 22px rgba(14,90,120,.3);font-family:var(--f-kyo);font-size:13.5px;line-height:1.65;color:var(--ink)}
.gpop.up{transform:translate(-50%,-100%)}
.gpop b{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--blue);letter-spacing:.04em;margin-bottom:2px}
.pin[data-sec="settings"] .ic::after{display:none;content:"";position:absolute;right:-2px;top:-2px;width:12px;height:12px;background:radial-gradient(circle,#FFF3B0 0 30%,rgba(255,226,122,0) 70%);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.honu,.uluru .sq,.pin[data-sec="settings"] .ic::after{animation:none}}
.gpop{text-align:left;border:0;cursor:pointer;font:inherit;font-family:var(--f-kyo);font-size:13.5px;line-height:1.65}
.gpop.side{transform:translate(0,-50%);width:205px}
.gpop i{display:block;font-style:normal;font-family:var(--f-body);font-size:11px;color:var(--ink-soft);margin-top:4px}
.honu .hl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-2px;background:var(--white);border-radius:999px;padding:0 9px;font-family:var(--f-kyo);font-weight:700;font-size:11.5px;color:var(--blue);white-space:nowrap;box-shadow:0 2px 8px rgba(14,90,120,.2)}

/* ハワイ：乗せるとハイビスカスが咲く／地球のへそ：乗せると現れる */
.hawaii{position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;z-index:2;display:grid;place-items:center;pointer-events:auto}
.hawaii .hib{width:40px;height:40px;opacity:0;transform:scale(.2) rotate(-60deg);transition:opacity .35s,transform .55s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 3px 5px rgba(184,62,42,.35))}
.hawaii .hib svg{width:100%;height:100%}
.hawaii{border:0;background:transparent;padding:0;cursor:pointer}
.hawaii:hover .hib,.hawaii:focus-visible .hib,.hawaii.on .hib{opacity:1;transform:scale(1) rotate(0deg)}
.touchmode .hawaii .hib{opacity:.6;transform:scale(.7)}
.uluru{opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .35s,transform .45s cubic-bezier(.3,1.5,.5,1)}
.uluru:hover,.uluru:focus-visible,.uluru.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.touchmode .uluru{opacity:.55;transform:translate(-50%,-50%) scale(.8)}

/* ===== 10/16：文字の大きさは右上（ラベルなし）・今週の授業・本棚・キャンパス ===== */
.atop{margin:-8px 0 -10px}
.atop .fs button,.headtools .fs button{width:38px;height:34px;min-height:0;padding:0;display:grid;place-items:center}
.lnow{flex-direction:row;flex-wrap:wrap;gap:20px;align-items:flex-start}
.lthumb{position:relative;flex:0 0 300px;max-width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#24434C}
.lthumb img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;max-width:none}
.lplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:3px solid #FFFFFF;background:rgba(14,127,170,.88);color:#FFFFFF;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.lplay svg{width:30px;height:30px;margin-left:4px}
.lplay:hover{background:var(--blue-bright)}
.ldur{position:absolute;right:10px;bottom:10px;background:rgba(36,67,76,.85);color:#FFFFFF;font-size:12px;border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums}
.lnew{position:absolute;left:10px;top:10px;background:var(--hibiscus);color:#3B1A12;font-size:11px;font-weight:700;border-radius:999px;padding:1px 10px;letter-spacing:.06em}
.linfo{flex:1 1 280px;display:flex;flex-direction:column;gap:8px;min-width:0}
.linfo h3{margin:0}
.lq{background:var(--lagoon-soft);border-radius:12px;padding:8px 12px}
.lq p{margin:0;font-family:var(--f-kyo);font-size:15px}
.lrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--panel-line)}
.lrow:last-child{border-bottom:0}
.lrow .ln{font-size:12px;font-weight:700;color:var(--accent);min-width:44px}
.lrow .ld{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px}
.lrow .lt{flex:1 1 200px;font-family:var(--f-kyo);font-weight:700;min-width:0}
.lrow .lm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@container mock (max-width:760px){.lthumb{flex:1 1 100%}.lrow .lt{flex-basis:100%;order:-1}}

.shelf{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:18px 18px 0;background:linear-gradient(180deg,#FBF8EE,#F5EEDB);border-radius:12px 12px 0 0;border-bottom:12px solid #C9A36A;box-shadow:0 4px 0 #A9844E}
.bk{position:relative;overflow:hidden;width:128px;height:176px;border-radius:4px 12px 12px 4px;background:linear-gradient(90deg,var(--c) 0 12px,#FBF8EE 12px);border:1px solid var(--line);box-shadow:5px 6px 0 rgba(36,67,76,.1);display:flex;flex-direction:column;justify-content:space-between;padding:16px 10px 10px 22px}
.bk .bt{position:relative;font-family:var(--f-kyo);font-weight:700;font-size:15px;line-height:1.5;color:var(--ink)}
.bk .bn{position:relative;font-size:12px;color:var(--ink-soft)}
.bk .bm{position:relative;font-size:11px;color:var(--ink-soft)}
.bk.making{background:linear-gradient(90deg,var(--c) 0 12px,#FFFFFF 12px);border-style:dashed}
.bk .bfill{position:absolute;left:12px;right:0;bottom:0;background:var(--c);opacity:.22}
.bk.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;gap:2px;padding:10px;color:var(--ink-soft);font-family:var(--f-kyo)}
.bk.empty small{font-size:11px}
.pubnow{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.pubnow .pt{font-family:var(--f-kyo);font-size:18px}
.libcount{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;background:var(--ivory-green);border-radius:12px;padding:10px 14px}
.libcount span{font-size:13px;color:var(--ink-soft)}
.libcount b{font-family:var(--f-kyo);font-size:24px;color:var(--leaf);font-variant-numeric:tabular-nums}

    document.getElementById('vc').setAttribute('aria-pressed',st.v==='c');
    document.getElementById('tabM').setAttribute('aria-selected',st.tab==='member');
    document.getElementById('tabA').setAttribute('aria-selected',st.tab==='avatar');
    if(st.tab==='member' && (st.v==='b'||st.v==='c')){
      if(TO_B[st.sec])st.sec=TO_B[st.sec]; if(st.sec!=='map'&&st.sec!=='consult'&&!VA[st.sec])st.sec='map';
      body.innerHTML=(st.sec==='map')?(st.v==='b'?mapView():campusView()):placeView(st.sec);
      if(st.sec==='map'){if(st.v==='b')afterMap();else afterCampus();}
    } else if(st.tab==='member'){
      if(st.sec==='map') st.sec='home';
      if(TO_A[st.sec])st.sec=TO_A[st.sec]; if(!VA[st.sec])st.sec='home';
      body.innerHTML='<div class="member fs-'+st.fs+'"><nav class="side" aria-label="会員メニュー">'+NAV_A.filter(function(n){return n[0]!=='settings';}).map(function(n){return '<button type="button" data-sec="'+n[0]+'"'+(st.sec===n[0]?' aria-current="page"':'')+'>'+navLabel(n)+'</button>';}).join('')+sidefoot()+'</nav><div class="main"><div class="atop">'+fsCtl()+'</div><div class="zoomwrap">'+VA[st.sec]()+'</div></div></div>';
    } else {
      body.innerHTML=avatarView();
    }
  }
  document.querySelectorAll('#segV button').forEach(function(b){b.addEventListener('click',function(){st.v=b.dataset.v;if(st.v!=='a'&&TO_B[st.sec])st.sec=TO_B[st.sec];if(st.v==='a'&&st.sec==='map')st.sec='home';if(st.v!=='a'&&st.sec==='home')st.sec='map';try{localStorage.setItem('tokuo-mp-v3',st.v);}catch(e){}render();});});
  mock.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||b.disabled) return;
    var ta=document.getElementById('repText'); if(ta) st.txt=ta.value;
    var rv=document.getElementById('revText'); if(rv) st.review=rv.value;
    if(b.dataset.tab){st.tab=b.dataset.tab;if(st.tab==='avatar'){st.cont=false;}render();return;}
    if(b.dataset.avatar){st.mood=b.dataset.mood||'';st.tab='avatar';st.cont=b.dataset.avatar==='cont';st.stage=st.cont?'free':'chat';st.theme='';st.reviewed=false;render();mock.scrollIntoView({block:'start'});return;}
    if(dragMoved){dragMoved=false;return;}
    if(b.dataset.fly){if(!flyTo(b.dataset.fly)){st.sec=b.dataset.fly;st.tab='member';render();}return;}
    if(b.classList.contains('pin')&&touchMode()){if(b.classList.contains('tapped'))return;b.classList.add('tapped');var sec=b.dataset.sec;setTimeout(function(){st.sec=sec;render();var t=document.getElementById('mock');if(t)t.scrollIntoView({block:'start'});},480);return;}
    if(b.dataset.calldolphin){st.dolphin=true;st.dolphinDone=false;st.feeds=0;render();return;}
    if(b.classList.contains('dolphin')){feedDolphin(b);return;}
    if(b.dataset.band){st.band=b.dataset.band;pickComment(st.band);render();return;}
    if(b.dataset.sec==='map'){st.cmt='';}
    if(b.dataset.sec)st.gpop='';
    if(b.dataset.sec){st.sec=b.dataset.sec;st.tab='member';if(b.dataset.rep)st.rep=b.dataset.rep;st.sent=false;st.copied='';render();return;}
    if(b.dataset.stage){st.stage=b.dataset.stage;if(st.stage!=='free')st.cont=false;st.reviewed=false;render();return;}
    if(b.dataset.theme){st.theme=b.dataset.theme;render();return;}
    if(b.dataset.me){meAct(b.dataset.me);return;}
    if(b.dataset.bike){var kb=document.getElementById('bkBub');if(kb){kb.textContent=BIKE_MSG[(st.bkN||0)%BIKE_MSG.length];st.bkN=(st.bkN||0)+1;kb.hidden=false;clearTimeout(window.__bkT);window.__bkT=setTimeout(function(){var x=document.getElementById('bkBub');if(x)x.hidden=true;},4000);}return;}
    if(b.dataset.friend){var fb=document.getElementById('frBub');if(fb){fb.textContent=FRIEND_MSG[(st.frN||0)%FRIEND_MSG.length];st.frN=(st.frN||0)+1;fb.hidden=false;fb.classList.remove('pop2');void fb.offsetWidth;fb.classList.add('pop2');clearTimeout(window.__frT);window.__frT=setTimeout(function(){var x=document.getElementById('frBub');if(x)x.hidden=true;},7000);}return;}
    if(b.dataset.fs){st.fs=b.dataset.fs;render();return;}
    if(b.dataset.play){st.play=(st.play==b.dataset.play)?'':b.dataset.play;render();return;}
    if(b.dataset.gim==='close'){st.gpop='';render();return;}
    if(b.dataset.gim){var g=b.dataset.gim;if(st.gpop===g){if(g==='honu')st.honuN=(st.honuN||0)+1;else st.uluN=(st.uluN||0)+1;}st.gpop=g;var sc0=document.getElementById('mapScroll');var keep=sc0?[sc0.scrollLeft,sc0.scrollTop]:null;render();if(keep){var sc1=document.getElementById('mapScroll');if(sc1){sc1.scrollLeft=keep[0];sc1.scrollTop=keep[1];}}return;}
    if(b.dataset.entry){st.entry[b.dataset.entry]=!st.entry[b.dataset.entry];render();return;}
    if(b.dataset.open){st.open=(st.tab==='member'&&st.open===b.dataset.open)?'':b.dataset.open;st.copied='';render();return;}
    if(b.dataset.copy){st.copied=st.open;render();return;}
    if(b.dataset.feel){st.feel=st.feel===b.dataset.feel?'':b.dataset.feel;render();return;}
    if(b.dataset.slot){var p=b.dataset.slot.split('|');st.habits[p[0]].slot=p[1];render();return;}
  });
  mock.addEventListener('change',function(e){
    var x=e.target;
    if(x.dataset.hon){st.habits[x.dataset.hon].on=x.checked;render();}
    else if(x.dataset.freq){st.habits[x.dataset.freq].freq=x.value;}
    else if(x.id==='repSel'){st.rep=x.value;}
    else if(x.id==='shareT'){st.share=x.checked;render();}
    else if(x.id==='triviaT'){st.trivia=x.checked;hideTip();}
  });
  mock.addEventListener('submit',function(e){e.preventDefault();
    if(e.target.id==='repForm'){var ta=document.getElementById('repText');if(ta)st.txt=ta.value;st.sent=true;}
    if(e.target.id==='revForm'){var rv=document.getElementById('revText');if(rv)st.review=rv.value;st.reviewed=true;}
    render();});

  var tipTimer=null,lastPt=null;
  function hideTip(){clearTimeout(tipTimer);var t=document.getElementById('mapTip');if(t)t.hidden=true;}
  function showTip(map,x,y){
    var t=document.getElementById('mapTip');if(!t||!map.isConnected)return;
    var r=map.getBoundingClientRect(),fx=(x-r.left)/r.width,fy=(y-r.top)/r.height,gy=(fy*520+40)/560;
    if(fx<0||fx>1||fy<0||fy>1)return;
    var ch=GRID.charAt(Math.min(GR-1,Math.floor(gy*GR))*GC+Math.min(GC-1,Math.floor(fx*GC)));
    if(ch==='.'||ch==='-'||!ch)return;
    var tr=TRIVIA[ch.charCodeAt(0)-65];if(!tr)return;
    t.innerHTML='<b>'+esc(tr[0])+'の豆知識</b>'+esc(tr[1]);
    t.style.left=(x-r.left)+'px';t.style.top=(y-r.top)+'px';
    t.className='tip'+(fx>.62?' tip-l':'')+(fy<.3?' tip-d':'');
    t.hidden=false;
  }
  mock.addEventListener('mousemove',function(e){
    var map=e.target.closest('.map');
    if(!map||!st.trivia){hideTip();lastPt=null;return;}
    if(lastPt&&Math.abs(e.clientX-lastPt[0])+Math.abs(e.clientY-lastPt[1])<5)return;
    lastPt=[e.clientX,e.clientY];hideTip();
    if(e.target.closest('.pin,.tcomment,.compass,.tip,.dolphin'))return;
    var cx=e.clientX,cy=e.clientY;
    tipTimer=setTimeout(function(){showTip(map,cx,cy);},5000);
  });
  mock.addEventListener('mouseleave',function(){hideTip();lastPt=null;});
  mock.addEventListener('animationend',function(e){if(e.target.id==='dolphin'&&e.animationName==='swim'){st.dolphinDone=true;e.target.remove();}});
  document.querySelectorAll('#segD button').forEach(function(b){b.addEventListener('click',function(){st.dev=b.dataset.dev;render();});});
  var lp=null,lpFired=false,dragMoved=false,drag=null;
  mock.addEventListener('pointerdown',function(e){
    var map=e.target.closest('.map');hideTip();lpFired=false;
    var sc=e.target.closest('.mapscroll');
    if(sc&&e.pointerType==='mouse'&&overflowing(sc)&&!e.target.closest('button')){drag={sc:sc,x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop,moved:false};}
    if(!map||!st.trivia||!touchMode()||e.target.closest('.pin,.dolphin,.tcomment,button'))return;
    var x=e.clientX,y=e.clientY;
    lp={x:x,y:y,timer:setTimeout(function(){lpFired=true;showTip(map,x,y);},900)};
  });
  mock.addEventListener('pointermove',function(e){
    if(lp&&Math.abs(e.clientX-lp.x)+Math.abs(e.clientY-lp.y)>10){clearTimeout(lp.timer);lp=null;}
    if(drag){var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(drag.moved){drag.sc.scrollLeft=drag.l-dx;drag.sc.scrollTop=drag.t-dy;}}
  });
  mock.addEventListener('pointerup',function(e){
    var wasLp=lp;if(lp){clearTimeout(lp.timer);lp=null;}
    if(drag){if(drag.moved){dragMoved=true;setTimeout(function(){dragMoved=false;},0);}var d=drag;drag=null;if(d.moved)return;}
    var map=e.target.closest('.map');
    if(map&&touchMode()&&!lpFired&&wasLp!==undefined&&!e.target.closest('.pin,.dolphin,.tcomment,button')){
      var r=map.getBoundingClientRect();sailTo(map,e.clientX-r.left,e.clientY-r.top);
    }
  });
  mock.addEventListener('pointercancel',function(){if(lp){clearTimeout(lp.timer);lp=null;}drag=null;});
  render();
})();
</script>
</body></html>
